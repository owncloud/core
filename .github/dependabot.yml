version: 2
updates:
  - package-ecosystem: composer
    directory: "/"
    schedule:
      interval: weekly
      day: sunday
      time: '22:00'
      timezone: Etc/UTC
    cooldown:
      default-days: 7
    open-pull-requests-limit: 5
    groups:
      minor-and-patch:
        update-types:
          - minor
          - patch

  # Same composer dependencies, but for the maintained 10.16 release branch.
  # Without an explicit target-branch Dependabot only ever opens PRs against the
  # default branch, so security fixes never reach the branch that ships in the
  # 10.16.x tarballs.
  - package-ecosystem: composer
    directory: "/"
    target-branch: "10.16"
    schedule:
      interval: weekly
      day: sunday
      time: '22:00'
      timezone: Etc/UTC
    cooldown:
      default-days: 7
    open-pull-requests-limit: 5
    groups:
      minor-and-patch:
        update-types:
          - minor
          - patch

  - package-ecosystem: npm
    directory: "/build"
    schedule:
      interval: weekly
      day: sunday
      time: '22:00'
      timezone: Etc/UTC
    cooldown:
      default-days: 7
    open-pull-requests-limit: 5
    groups:
      minor-and-patch:
        update-types:
          - minor
          - patch

  # npm for the 10.16 release branch. Major updates are ignored: 10.16 is a
  # maintenance branch, and its CI runs no JS unit tests to catch a breaking bump.
  - package-ecosystem: npm
    directory: "/build"
    target-branch: "10.16"
    schedule:
      interval: weekly
      day: sunday
      time: '22:00'
      timezone: Etc/UTC
    cooldown:
      default-days: 7
    open-pull-requests-limit: 5
    ignore:
      - dependency-name: "*"
        update-types:
          - version-update:semver-major
    groups:
      minor-and-patch:
        update-types:
          - minor
          - patch

  - package-ecosystem: github-actions
    directory: "/"
    schedule:
      interval: weekly
      day: sunday
      time: '22:00'
      timezone: Etc/UTC
    cooldown:
      default-days: 7
    open-pull-requests-limit: 5
    groups:
      minor-and-patch:
        update-types:
          - minor
          - patch

  # The 10.16 release branch has its own workflows with their own pinned SHAs.
  - package-ecosystem: github-actions
    directory: "/"
    target-branch: "10.16"
    schedule:
      interval: weekly
      day: sunday
      time: '22:00'
      timezone: Etc/UTC
    cooldown:
      default-days: 7
    open-pull-requests-limit: 5
    groups:
      minor-and-patch:
        update-types:
          - minor
          - patch
